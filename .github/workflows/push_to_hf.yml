name: Push to Hugging Face Space

on:
    push:
        branches: ["main"]

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Push to Hugging Face
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  HF_USERNAME: ${{ secrets.HF_USERNAME }}
                  HF_SPACE: ${{ secrets.HF_SPACE }}
              run: |
                  set -euo pipefail

                  # Fail fast if secrets are missing
                  if [ -z "${HF_TOKEN}" ] || [ -z "${HF_USERNAME}" ] || [ -z "${HF_SPACE}" ]; then
                    echo "Missing HF secrets. Ensure HF_TOKEN, HF_USERNAME, HF_SPACE are set in GitHub Secrets."
                    exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  HF_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}.git"

                  git remote remove hf 2>/dev/null || true
                  git remote add hf "${HF_URL}"

                  git push hf HEAD:main --force-with-lease
