name: Push to Hugging Face Space

on:
    push:
        branches: ["main"]

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Push to Hugging Face
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  HF_USERNAME: ${{ secrets.HF_USERNAME }}
                  HF_SPACE: ${{ secrets.HF_SPACE }}
              run: |
                  set -e

                  # Configure git identity for the bot
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Add Hugging Face remote (authenticated)
                  HF_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}.git"
                  git remote add hf "${HF_URL}" || git remote set-url hf "${HF_URL}"

                  # Push main to HF main (force-with-lease avoids accidental overwrites)
                  git push hf main:main --force-with-lease
